name: Upgrade Trunk

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Upgrade Trunk infrastructure
        run: ./trunk upgrade cli plugins runtimes --yes-to-all --ci --no-progress

      - name: Check Trunk
        run: ./trunk check --ci --no-progress

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No Trunk upgrades available."
            exit 0
          fi

          branch="automation/trunk-upgrade"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .trunk trunk
          git commit -m "Upgrade Trunk infrastructure"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number --jq .number >/dev/null 2>&1; then
            echo "Existing Trunk upgrade PR updated."
          else
            gh pr create \
              --title "Upgrade Trunk infrastructure" \
              --body "Updates Trunk CLI, plugin, and runtime pins." \
              --base main \
              --head "$branch"
          fi

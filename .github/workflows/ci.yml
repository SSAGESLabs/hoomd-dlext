name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'SSAGESLabs/hoomd-dlext'
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .

  test:
    if: github.repository == 'SSAGESLabs/hoomd-dlext'
    name: HOOMD ${{ matrix.hoomd }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11.0 and 4.9.1 (final 3.x / 4.x) cover the GlobalArray path; 5.0.0
        # is the GlobalArray -> GPUArray boundary; 7.0.1 is current.
        include:
          - hoomd: "3.11.0"
            cxx_compiler: "cxx-compiler=1.5.2"
            pybind11: "pybind11<3"
            eigen: "eigen<5"
          - hoomd: "4.9.1"
            cxx_compiler: "cxx-compiler=1.8.0"
            pybind11: "pybind11<3"
            eigen: "eigen<5"
          - hoomd: "5.0.0"
            cxx_compiler: "cxx-compiler=1.8.0"
            pybind11: "pybind11<3"
            eigen: "eigen<5"
          - hoomd: "6.1.1"
            eigen: "eigen<5"
          - hoomd: "7.0.1"

    steps:
      - name: Check out repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # setuptools-scm derives the plugin version from git tags

      - name: Set up environment (HOOMD ${{ matrix.hoomd }})
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476 # v3.0.0
        with:
          environment-name: dlext
          create-args: >-
            python>=3.10
            hoomd=${{ matrix.hoomd }}
            ${{ matrix.cxx_compiler || 'cxx-compiler' }}
            ${{ matrix.pybind11 || 'pybind11' }}
            cmake
            make
            ${{ matrix.eigen || 'eigen' }}
            tbb-devel
            gsd
            numpy
            pytest
            setuptools-scm

      - name: Build and install the plugin
        shell: bash -el {0}
        run: |
          hoomd_root=$(python -c "import hoomd, os; print(os.path.dirname(hoomd.__file__))")
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="${hoomd_root}" -DHOOMD_ROOT="${hoomd_root}"
          cmake --build build -j "$(nproc)"
          cmake --install build

      - name: Import smoke test
        shell: bash -el {0}
        run: python -c "import hoomd, hoomd.dlext; print('hoomd.dlext', hoomd.dlext.__version__)"

      - name: Run interop smoke test
        shell: bash -el {0}
        run: pytest tests/test_interop.py -v

      - name: Run restart regression tests
        shell: bash -el {0}
        run: pytest tests/test_restart.py -v

  trunk:
    if: github.repository == 'SSAGESLabs/hoomd-dlext'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

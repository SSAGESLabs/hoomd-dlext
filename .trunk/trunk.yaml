version: 0.1
cli:
  version: 1.25.0
lint:
  enabled:
    - actionlint@1.7.12
    - black@26.5.1
    - git-diff-check
    - gitleaks@8.30.1
    - hadolint@2.14.0
    - rumdl@0.2.7
    - ruff@0.15.15
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - taplo@0.10.0
    - clang-format@16.0.3
    - yamllint@1.38.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
runtimes:
  enabled:
    - go@1.21.0
    - python@3.14.4
